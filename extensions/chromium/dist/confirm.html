<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Choose download app · GrabBit</title>
    <link rel="stylesheet" href="confirm.css">
  </head>
  <body>
    <header><img src="icon.png" alt=""><div><strong>Choose download app</strong><span>Chrome continues until GrabBit safely accepts the job.</span></div></header>
    <main>
      <div class="download"><strong id="filename">New download</strong><span id="hostname">Checking host…</span></div>
      <p id="status">Where would you like to download this file?</p>
      <button id="grabbit" class="primary">Download with GrabBit</button>
      <button id="chrome">Continue with Chrome</button>
      <small>GrabBit never receives browser cookies, authorization headers, or request bodies. Chrome may already have transferred some bytes.</small>
    </main>
    <script type="module" src="confirm.js"></script>
  </body>
</html>
